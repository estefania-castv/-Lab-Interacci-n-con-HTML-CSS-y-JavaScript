<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi primer sitio</title>

  <!-- Enlazar CSS con HTML -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Encabezado "¡Hola mundo!" (JS lo cambiará a "Adiós") -->
  <h1 id="saludo">¡Hola mundo!</h1>

  <!-- Imagen desde el directorio de imágenes -->
  <img src="Pictures/H - Horse.jpg" alt="Imagen de ejemplo" width="300">

  <!-- Cuatro encabezados más que dicen "Hola mundo" -->
  <h1 id="rojo">Hola mundo</h1>
  <h1 class="azul">Hola mundo</h1>
  <h1 class="azul">Hola mundo</h1>
  <h1 id="naranja">Hola mundo</h1>

  <!-- Encabezado en el que se puede hacer clic (JS lo cambia a marrón) -->
  <h1 id="clic">Haz clic aquí</h1>

  <!-- RETO EXTRA: etiqueta que no se mencionó en la clase -->
  <p id="extra">Soy un párrafo extra.</p>

  <!-- Enlazar JavaScript con HTML -->
  <script src="script.js"></script>
</body>
</html>
